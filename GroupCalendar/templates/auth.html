<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="/static/js/api.js" type="module"></script>
    <script src="/static/js/auth.js" type="module"></script>

    <title>Document</title>
</head>
<body>
    <div class="container p-5">
        <div class="d-flex w-100 mb-4 title">
            <h2 class="m-auto">Please Please Please When Can We Hangout</h2>
        </div>
        <div class="g-0 container-fluid d-flex justify-content-start">
            <h3 class="my-auto">Register</h3>
            <div class="d-flex">
                <p class="my-auto mx-2 fs-5">or</p>
                <button class="btn btn-outline-dark fs-5">Login</button>
            </div>
        </div>
        <form class="mt-4">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" aria-describedby="username-help">
                <div id="username-help" class="form-text">Username must be shorter than 20 characters</div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" aria-describedby="password-help">
                <div id="password-help" class="form-text">Password must be at least 8 characters long</div>
            </div>
            <div class="mb-3" id="re-password-div">
                <label for="re-password" class="form-label">Enter password again</label>
                <input type="password" class="form-control" name="re-password" id="re-password">
            </div>
            <button type="sumbit" class="mt-3 btn btn-primary btn-lg">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <template>
        
    </template>
</body>
</html>
